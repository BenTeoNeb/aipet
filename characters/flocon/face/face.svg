<svg viewBox="0 0 200 200" aria-hidden="true">
  <!-- tail, behind the head -->
  <g id="tail">
    <path class="tail-out" d="M148 176 Q196 182 188 138 Q185 124 175 130"/>
    <path class="tail-in"  d="M148 176 Q196 182 188 138 Q185 124 175 130"/>
  </g>
  <g id="bob"><g id="pose"><g id="head">
    <!-- ears -->
    <g class="ear left"><g class="tw">
      <path class="fur" d="M38 92 L50 28 Q54 22 60 27 L96 62 Z"/>
      <path class="inner-ear" d="M50 80 L57 40 L84 65 Z"/>
    </g></g>
    <g class="ear right"><g class="tw">
      <path class="fur" d="M162 92 L150 28 Q146 22 140 27 L104 62 Z"/>
      <path class="inner-ear" d="M150 80 L143 40 L116 65 Z"/>
    </g></g>
    <!-- head and little tuft -->
    <ellipse class="fur" cx="100" cy="118" rx="74" ry="62"/>
    <path class="soft" d="M93 62 Q96 54 100 60 Q104 52 108 62"/>
    <!-- cheeks -->
    <ellipse class="cheek" cx="54" cy="136" rx="14" ry="8.5"/>
    <ellipse class="cheek" cx="146" cy="136" rx="14" ry="8.5"/>
    <!-- eyebrows -->
    <path class="ink brow left" d="M60 91 Q70 86 80 90"/>
    <path class="ink brow right" d="M140 91 Q130 86 120 90"/>
    <!-- eyes -->
    <g class="eye left">
      <g class="open">
        <ellipse class="eyeball" cx="72" cy="111" rx="11" ry="14"/>
        <g class="look">
          <ellipse class="iris" cx="72" cy="114" rx="8" ry="9.5"/>
          <ellipse class="pupil" cx="72" cy="113" rx="5" ry="7"/>
          <circle class="shine big" cx="76" cy="105.5" r="3.8"/><circle class="shine" cx="68.5" cy="117" r="1.8"/>
        </g>
      </g>
      <path class="ink arc up" d="M61 114 Q72 101 83 114"/>
      <path class="ink arc down" d="M61 109 Q72 120 83 109"/>
    </g>
    <g class="eye right">
      <g class="open">
        <ellipse class="eyeball" cx="128" cy="111" rx="11" ry="14"/>
        <g class="look">
          <ellipse class="iris" cx="128" cy="114" rx="8" ry="9.5"/>
          <ellipse class="pupil" cx="128" cy="113" rx="5" ry="7"/>
          <circle class="shine big" cx="132" cy="105.5" r="3.8"/><circle class="shine" cx="124.5" cy="117" r="1.8"/>
        </g>
      </g>
      <path class="ink arc up" d="M117 114 Q128 101 139 114"/>
      <path class="ink arc down" d="M117 109 Q128 120 139 109"/>
    </g>
    <!-- nose and mouth -->
    <ellipse id="mouth-open" cx="100" cy="144" rx="7" ry="9"/>
    <g id="mouth">
      <path class="ink m-w" d="M100 133 L100 138 M88 138 Q94 146 100 138 Q106 146 112 138"/>
      <path class="ink m-smile" d="M100 133 L100 138 M85 136 Q93 149 100 138 Q107 149 115 136"/>
      <path class="ink m-smirk" d="M100 133 L100 138 M89 139 Q95 145 100 138 Q108 148 116 134"/>
      <path class="ink m-sad" d="M100 133 L100 137 M92 145 Q100 137 108 145"/>
      <path class="ink m-flat" d="M100 133 L100 138 M94 141 Q100 143 106 140"/>
      <ellipse class="mouth-fill m-o" cx="100" cy="145" rx="5.5" ry="7"/>
      <g class="m-laugh"><path class="mouth-fill" d="M87 138 Q100 162 113 138 Z"/><ellipse class="tongue" cx="100" cy="149" rx="5" ry="3.2"/></g>
    </g>
    <path class="nose" d="M93 128 Q100 124 107 128 Q100 137 93 128 Z"/>
    <!-- whiskers -->
    <g class="wh l"><line class="whisker" x1="20" y1="122" x2="56" y2="128"/><line class="whisker" x1="22" y1="140" x2="56" y2="136"/></g>
    <g class="wh r"><line class="whisker" x1="180" y1="122" x2="144" y2="128"/><line class="whisker" x1="178" y1="140" x2="144" y2="136"/></g>
  </g></g>
    <!-- paws resting on the edge -->
    <g class="paw l"><ellipse class="fur" cx="68" cy="186" rx="17" ry="11"/><path class="soft" d="M62 181 L62 188 M70 180 L70 188"/></g>
    <g class="paw r"><ellipse class="fur" cx="132" cy="186" rx="17" ry="11"/><path class="soft" d="M130 180 L130 188 M138 181 L138 188"/></g>
  </g>
  <!-- little signs -->
  <g class="fx fx-hearts">
    <path class="heart" transform="translate(24 62) scale(2.2)" d="M0 4 C-7 -2 -3 -7 0 -3 C3 -7 7 -2 0 4 Z"/>
    <path class="heart" transform="translate(176 54) scale(2.8)" d="M0 4 C-7 -2 -3 -7 0 -3 C3 -7 7 -2 0 4 Z"/>
    <path class="heart" transform="translate(150 16) scale(1.8)" d="M0 4 C-7 -2 -3 -7 0 -3 C3 -7 7 -2 0 4 Z"/>
  </g>
  <g class="fx fx-stars">
    <path class="star" transform="translate(22 58) scale(1.5)" d="M0 -7 Q1 -1 7 0 Q1 1 0 7 Q-1 1 -7 0 Q-1 -1 0 -7 Z"/>
    <path class="star" transform="translate(178 50) scale(1.9)" d="M0 -7 Q1 -1 7 0 Q1 1 0 7 Q-1 1 -7 0 Q-1 -1 0 -7 Z"/>
    <path class="star" transform="translate(100 10) scale(1.2)" d="M0 -7 Q1 -1 7 0 Q1 1 0 7 Q-1 1 -7 0 Q-1 -1 0 -7 Z"/>
  </g>
  <g class="fx fx-wink"><path class="star" transform="translate(160 88) scale(1.3)" d="M0 -7 Q1 -1 7 0 Q1 1 0 7 Q-1 1 -7 0 Q-1 -1 0 -7 Z"/></g>
  <g class="fx fx-zzz"><text x="150" y="62" font-size="15">z</text><text x="163" y="44" font-size="20">z</text><text x="178" y="24" font-size="26">Z</text></g>
  <g class="fx fx-ask"><text x="168" y="52" style="font-size:40px; fill:var(--accent)">?</text></g>
  <g class="fx fx-dots"><circle class="dot" cx="152" cy="46" r="3.5"/><circle class="dot" cx="165" cy="36" r="5"/><circle class="dot" cx="181" cy="24" r="6.5"/></g>
  <g class="fx fx-rays"><line class="ray" x1="100" y1="16" x2="100" y2="2"/><line class="ray" x1="70" y1="20" x2="62" y2="8"/><line class="ray" x1="130" y1="20" x2="138" y2="8"/></g>
  <g class="fx fx-ha"><path class="ha" d="M14 96 q-7 8 0 16"/><path class="ha" d="M186 96 q7 8 0 16"/><path class="ha" d="M4 90 q-9 14 0 28"/><path class="ha" d="M196 90 q9 14 0 28"/></g>
</svg>
