<svg viewBox="0 0 200 200" aria-hidden="true">
  <!-- tail feathers, behind the body -->
  <g id="tail">
    <path class="fur" d="M86 176 L92 198 L100 186 L108 198 L114 176 Z"/>
  </g>
  <g id="bob"><g id="pose"><g id="head">
    <!-- ear tufts -->
    <g class="ear left"><g class="tw">
      <path class="fur" d="M50 78 L40 26 Q44 22 49 27 L78 60 Z"/>
      <path class="inner-ear" d="M52 68 L46 36 L66 58 Z"/>
    </g></g>
    <g class="ear right"><g class="tw">
      <path class="fur" d="M150 78 L160 26 Q156 22 151 27 L122 60 Z"/>
      <path class="inner-ear" d="M148 68 L154 36 L134 58 Z"/>
    </g></g>
    <!-- round body-head and the light face disc around the eyes -->
    <ellipse class="fur" cx="100" cy="118" rx="76" ry="66"/>
    <path class="disc" d="M100 82 Q76 66 54 82 Q34 104 50 128 Q66 146 100 136 Q134 146 150 128 Q166 104 146 82 Q124 66 100 82 Z"/>
    <path class="soft" d="M92 60 Q96 52 100 58 Q104 50 108 60"/>
    <!-- chest feathers -->
    <path class="soft" d="M78 160 q6 6 12 0 M94 166 q6 6 12 0 M110 160 q6 6 12 0"/>
    <!-- cheeks -->
    <ellipse class="cheek" cx="48" cy="138" rx="12" ry="7.5"/>
    <ellipse class="cheek" cx="152" cy="138" rx="12" ry="7.5"/>
    <!-- feather brows -->
    <path class="ink brow left" d="M54 86 Q68 78 84 86"/>
    <path class="ink brow right" d="M146 86 Q132 78 116 86"/>
    <!-- big round eyes -->
    <g class="eye left">
      <g class="open">
        <circle class="eyeball" cx="72" cy="108" r="17"/>
        <g class="look">
          <circle class="iris" cx="72" cy="109" r="13"/>
          <circle class="pupil" cx="72" cy="109" r="7.5"/>
          <circle class="shine big" cx="77" cy="102" r="4.2"/><circle class="shine" cx="67" cy="114" r="2"/>
        </g>
      </g>
      <path class="ink arc up" d="M56 112 Q72 96 88 112"/>
      <path class="ink arc down" d="M56 106 Q72 122 88 106"/>
    </g>
    <g class="eye right">
      <g class="open">
        <circle class="eyeball" cx="128" cy="108" r="17"/>
        <g class="look">
          <circle class="iris" cx="128" cy="109" r="13"/>
          <circle class="pupil" cx="128" cy="109" r="7.5"/>
          <circle class="shine big" cx="133" cy="102" r="4.2"/><circle class="shine" cx="123" cy="114" r="2"/>
        </g>
      </g>
      <path class="ink arc up" d="M112 112 Q128 96 144 112"/>
      <path class="ink arc down" d="M112 106 Q128 122 144 106"/>
    </g>
    <!-- mouth (under the beak) -->
    <ellipse id="mouth-open" cx="100" cy="146" rx="6" ry="7"/>
    <g id="mouth">
      <path class="ink m-w" d="M93 145 Q100 149 107 145"/>
      <path class="ink m-smile" d="M89 143 Q100 153 111 143"/>
      <path class="ink m-smirk" d="M92 146 Q101 150 112 141"/>
      <path class="ink m-sad" d="M92 150 Q100 143 108 150"/>
      <path class="ink m-flat" d="M94 147 L106 147"/>
      <ellipse class="mouth-fill m-o" cx="100" cy="148" rx="5" ry="6"/>
      <g class="m-laugh"><path class="mouth-fill" d="M89 143 Q100 162 111 143 Z"/><ellipse class="tongue" cx="100" cy="151" rx="4.5" ry="3"/></g>
    </g>
    <!-- beak -->
    <path class="beak" d="M92 122 Q100 118 108 122 L100 140 Z"/>
  </g></g>
    <!-- wings folded on the sides (they move like paws: hug, startle) -->
    <g class="paw l"><path class="fur" d="M30 120 Q14 150 34 182 Q50 170 50 140 Z"/><path class="soft" d="M30 150 q8 4 14 0 M32 164 q8 4 14 0"/></g>
    <g class="paw r"><path class="fur" d="M170 120 Q186 150 166 182 Q150 170 150 140 Z"/><path class="soft" d="M156 150 q8 4 14 0 M154 164 q8 4 14 0"/></g>
  </g>
  <!-- little signs -->
  <g class="fx fx-hearts">
    <path class="heart" transform="translate(24 62) scale(2.2)" d="M0 4 C-7 -2 -3 -7 0 -3 C3 -7 7 -2 0 4 Z"/>
    <path class="heart" transform="translate(176 54) scale(2.8)" d="M0 4 C-7 -2 -3 -7 0 -3 C3 -7 7 -2 0 4 Z"/>
    <path class="heart" transform="translate(150 16) scale(1.8)" d="M0 4 C-7 -2 -3 -7 0 -3 C3 -7 7 -2 0 4 Z"/>
  </g>
  <g class="fx fx-stars">
    <path class="star" transform="translate(22 58) scale(1.5)" d="M0 -7 Q1 -1 7 0 Q1 1 0 7 Q-1 1 -7 0 Q-1 -1 0 -7 Z"/>
    <path class="star" transform="translate(178 50) scale(1.9)" d="M0 -7 Q1 -1 7 0 Q1 1 0 7 Q-1 1 -7 0 Q-1 -1 0 -7 Z"/>
    <path class="star" transform="translate(100 10) scale(1.2)" d="M0 -7 Q1 -1 7 0 Q1 1 0 7 Q-1 1 -7 0 Q-1 -1 0 -7 Z"/>
  </g>
  <g class="fx fx-wink"><path class="star" transform="translate(160 88) scale(1.3)" d="M0 -7 Q1 -1 7 0 Q1 1 0 7 Q-1 1 -7 0 Q-1 -1 0 -7 Z"/></g>
  <g class="fx fx-zzz"><text x="150" y="62" font-size="15">z</text><text x="163" y="44" font-size="20">z</text><text x="178" y="24" font-size="26">Z</text></g>
  <g class="fx fx-ask"><text x="168" y="52" style="font-size:40px; fill:var(--accent)">?</text></g>
  <g class="fx fx-dots"><circle class="dot" cx="152" cy="46" r="3.5"/><circle class="dot" cx="165" cy="36" r="5"/><circle class="dot" cx="181" cy="24" r="6.5"/></g>
  <g class="fx fx-rays"><line class="ray" x1="100" y1="16" x2="100" y2="2"/><line class="ray" x1="70" y1="20" x2="62" y2="8"/><line class="ray" x1="130" y1="20" x2="138" y2="8"/></g>
  <g class="fx fx-ha"><path class="ha" d="M14 96 q-7 8 0 16"/><path class="ha" d="M186 96 q7 8 0 16"/><path class="ha" d="M4 90 q-9 14 0 28"/><path class="ha" d="M196 90 q9 14 0 28"/></g>
</svg>
