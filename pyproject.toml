[project]
name = "aipet"
version = "0.1.0"
description = "A French voice AI pet for kids (Pipecat): a shared core and a catalogue of pet characters, headless on a Raspberry Pi with a web debug page."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Benjamin Farcy" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic[vertex]>=2.8.0",
    "openwakeword>=0.6.0",
    "pipecat-ai[google,local,runner,silero,webrtc]>=1.15.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
pet-web = "aipet.web:run"            # web page (show + debug), http://localhost:7860
pet-headless = "aipet.headless:run"  # Raspberry Pi: microphone + speaker + wake word
pet-analyze = "aipet.analyze:main"   # session-log statistics (no API calls)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aipet"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # long lines: French prompt texts are left as written
    "B008",   # function calls in defaults (Pipecat settings objects)
]

[tool.ruff.lint.isort]
known-first-party = ["aipet"]
